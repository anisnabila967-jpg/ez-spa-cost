<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EZ SPA COST | Azie Balinese Spa</title>

<style>
:root {
  --pink:#f43f65;
  --pink-dark:#9f1239;
  --green:#059669;
  --ink:#253044;
  --muted:#758094;
  --line:#f3dce2;
  --bg:#f8f7f7;
  --white:#fff;
}
* { box-sizing:border-box; }
body {
  margin:0;
  font-family:Inter,"Segoe UI",Arial,sans-serif;
  color:var(--ink);
  background:linear-gradient(135deg,#fff8fa,#f6fbf9);
  min-height:100vh;
}
button,input,select,textarea { font:inherit; }
button {
  cursor:pointer;
  border:0;
  border-radius:11px;
  padding:10px 14px;
  font-weight:700;
  transition:.15s;
}
button:hover { filter:brightness(.97); transform:translateY(-1px); }
.app { display:grid; grid-template-columns:290px minmax(0,1fr); min-height:100vh; }
.sidebar {
  background:#fff;
  border-right:1px solid #f4dce2;
  position:sticky;
  top:0;
  height:100vh;
  overflow:auto;
}
.brand {
  padding:25px 18px 22px;
  text-align:center;
  background:linear-gradient(145deg,#fff2f5,#fff);
  border-bottom:1px solid #ffe0e7;
}
.brand-mark {
  width:66px;
  height:66px;
  border-radius:50%;
  background:#fde1e6;
  color:var(--pink);
  display:grid;
  place-items:center;
  font-size:31px;
  margin:0 auto 10px;
}
.brand h1 {
  font-family:Georgia,serif;
  color:var(--pink-dark);
  font-size:27px;
  margin:0 0 6px;
}
.badge {
  display:inline-block;
  background:#d1fae5;
  color:#066b52;
  border-radius:20px;
  padding:5px 14px;
  font-size:12px;
  font-weight:800;
  letter-spacing:.5px;
}
.brand p { margin:8px 0 0; color:var(--muted); font-style:italic; font-size:14px; }
.nav { padding:12px 10px; }
.nav button {
  display:flex;
  gap:12px;
  align-items:center;
  width:100%;
  background:transparent;
  color:#3d485b;
  text-align:left;
  padding:13px 14px;
  margin:3px 0;
  border-radius:10px;
  font-weight:650;
}
.nav button.active,.nav button:hover { background:#fff0f3; color:var(--pink-dark); }
.nav .ico { width:22px; font-size:19px; text-align:center; }
.side-note {
  padding:15px;
  border-top:1px solid #ffe0e7;
  background:#fff8fa;
  font-size:12px;
  color:var(--muted);
}
.main { padding:22px 26px 35px; min-width:0; }
.toolbar {
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  background:#fff;
  border:1px solid #ffb8c6;
  border-left:5px solid #ff6580;
  border-radius:18px;
  padding:16px 18px;
  box-shadow:0 5px 12px #1b24330d;
  margin-bottom:27px;
}
.toolbar strong { margin-right:2px; }
.toolbar select {
  border:1px solid #ffd1da;
  border-radius:10px;
  padding:10px 12px;
  background:white;
  color:var(--ink);
}
.spacer { flex:1; }
.btn-green { background:#059669; color:white; }
.btn-pink { background:#e91e4d; color:white; }
.btn-soft { background:#ffe6eb; color:#a40e37; }
.btn-outline { background:white; border:1px solid #f6c6d1; color:#9f1239; }
.hero {
  position:relative;
  overflow:hidden;
  border:1px solid white;
  border-radius:28px;
  padding:30px 20px 32px;
  text-align:center;
  background:linear-gradient(110deg,#fcecf6,#f8f9ff 48%,#d9faeb);
  box-shadow:0 10px 18px #1b243315;
  margin-bottom:27px;
}
.hero:after {
  content:"✿";
  position:absolute;
  right:12px;
  bottom:-65px;
  font-size:190px;
  color:#b4b5a044;
  transform:rotate(-15deg);
}
.lotus {
  position:relative;
  z-index:1;
  width:75px;
  height:75px;
  border-radius:50%;
  background:white;
  box-shadow:0 3px 7px #0002;
  display:grid;
  place-items:center;
  font-size:36px;
  color:var(--pink);
  margin:0 auto 8px;
}
.hero h2 {
  position:relative;
  z-index:1;
  font-family:Georgia,serif;
  font-size:clamp(32px,4vw,54px);
  margin:0;
  color:#222b3b;
  letter-spacing:-1.5px;
}
.tagline {
  position:relative;
  z-index:1;
  color:var(--pink);
  font-family:Georgia,serif;
  font-style:italic;
  font-size:21px;
  margin:2px 0 13px;
}
.hero h3 {
  position:relative;
  z-index:1;
  color:#08684f;
  font-family:Georgia,serif;
  font-size:clamp(27px,3vw,42px);
  letter-spacing:2px;
  margin:0;
}
.hero p { position:relative; z-index:1; margin:0; color:#536073; font-weight:600; }
.cards { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:17px; }
.card {
  min-height:144px;
  border:1px solid var(--card-border,#f9c9d3);
  background:var(--card-bg,#fff0f2);
  border-radius:19px;
  padding:17px 12px;
  text-align:center;
  display:flex;
  align-items:center;
  flex-direction:column;
  justify-content:center;
  color:var(--ink);
  cursor:pointer;
}
.card:hover { box-shadow:0 8px 18px #1b243315; transform:translateY(-2px); }
.card .icon {
  width:57px;
  height:57px;
  border-radius:18px;
  display:grid;
  place-items:center;
  color:white;
  background:var(--accent,#fb7185);
  font-size:26px;
  box-shadow:0 3px 5px #0001;
  margin-bottom:10px;
}
.card b { font-size:14px; }
.card small { font-size:12px; color:#788296; margin-top:5px; }
.card.wide { grid-column:span 2; }
.page {
  background:#fff;
  border:1px solid #f4dce2;
  border-radius:20px;
  padding:22px;
  box-shadow:0 5px 15px #1b243308;
}
.page-head {
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:20px;
}
.page h2 { margin:0 0 5px; font-size:25px; }
.muted { color:var(--muted); font-size:13px; }
.stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin-bottom:18px; }
.stat {
  border:1px solid #f1dfe5;
  border-radius:15px;
  padding:17px;
  background:linear-gradient(135deg,#fff,#fff8fa);
}
.stat span { font-size:12px; color:var(--muted); }
.stat strong { display:block; font-size:24px; margin-top:7px; }
.form-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:13px; margin-bottom:18px; }
.field { display:flex; flex-direction:column; gap:6px; }
.field label { font-size:12px; font-weight:750; color:#536073; }
.field input,.field select,.field textarea {
  width:100%;
  padding:10px 11px;
  border:1px solid #e7dfe3;
  border-radius:9px;
  background:#fff;
  color:var(--ink);
  min-width:0;
}
.field textarea { min-height:75px; resize:vertical; }
.actions { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 18px; }
.table-wrap { overflow:auto; border:1px solid #eee3e7; border-radius:12px; }
table { width:100%; border-collapse:collapse; min-width:720px; }
th,td { padding:12px 11px; text-align:left; border-bottom:1px solid #f1e8eb; font-size:13px; }
th { background:#fff5f7; color:#8c2442; font-size:12px; white-space:nowrap; }
tr:last-child td { border-bottom:0; }
td .mini { padding:6px 8px; font-size:11px; background:#ffe7ec; color:#9f1239; }
.empty { text-align:center; color:#8a94a5; padding:25px; }
.notice {
  padding:12px 14px;
  border-radius:10px;
  background:#effcf6;
  color:#087454;
  border:1px solid #c7f0df;
  font-size:13px;
  margin:12px 0;
}
.warning { background:#fff8e6; border-color:#f9e2a3; color:#8a5b00; }
.chart-bars { display:flex; align-items:end; gap:12px; height:180px; padding:18px 8px 0; border-bottom:1px solid #e9e1e4; }
.bar-col { flex:1; min-width:20px; text-align:center; height:100%; display:flex; flex-direction:column; justify-content:end; align-items:center; gap:6px; }
.bar { width:min(42px,70%); min-height:3px; background:linear-gradient(#34d399,#059669); border-radius:7px 7px 0 0; }
.bar-col small { font-size:10px; color:var(--muted); }
.bar-col em { font-size:10px; font-style:normal; }
.footer { color:#98a0ad; text-align:center; font-size:11px; margin-top:22px; }

@media(max-width:1200px) {
  .cards { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .stats { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .app { grid-template-columns:250px minmax(0,1fr); }
  .main { padding:18px; }
}
@media(max-width:780px) {
  .app { display:block; }
  .sidebar { position:relative; height:auto; }
  .nav { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); }
  .nav button { font-size:12px; padding:10px; }
  .main { padding:12px; }
  .toolbar { padding:12px; }
  .cards { grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
  .card.wide { grid-column:span 2; }
  .form-grid { grid-template-columns:1fr 1fr; }
  .hero { padding:25px 10px; }
  .stats { gap:8px; }
  .stat { padding:12px; }
  .stat strong { font-size:19px; }
}
@media(max-width:460px) {
  .form-grid { grid-template-columns:1fr; }
  .cards { grid-template-columns:1fr 1fr; }
  .toolbar .spacer { display:none; }
}
@media print {
  .sidebar,.toolbar,.actions,.no-print { display:none!important; }
  .app { display:block; }
  .main { padding:0; }
  .hero,.page { box-shadow:none; }
  .page { border:0; }
  .cards { grid-template-columns:repeat(3,1fr); }
  body { background:white; }
}
</style>
</head>

<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">♧</div>
      <h1>Azie Balinese Spa</h1>
      <span class="badge">EZ SPA COST V2.5</span>
      <p>Sistem Pengurusan &amp; Kos Spa</p>
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="side-note">
      <b>◉ Tetapan Tema &amp; Gambar</b>
      <p>Versi demo setempat · Data disimpan dalam pelayar ini.</p>
      <button class="btn-outline" onclick="resetAll()">Padam Semua Data</button>
    </div>
  </aside>

  <main class="main">
    <div class="toolbar no-print">
      <strong>▦ Tempoh Laporan:</strong>
      <select id="month" aria-label="Bulan"></select>
      <select id="year" aria-label="Tahun"></select>
      <button class="btn-green" onclick="addYear()">＋ Tambah Tahun</button>
      <button class="btn-soft" onclick="resetMonth()">⟲ Reset Borang Bulan Ini</button>
      <span class="spacer"></span>
      <button class="btn-green" onclick="exportExcel()">▣ Export Excel Pastel</button>
      <button class="btn-pink" onclick="printReport()">▣ Cetak Laporan (Million Style)</button>
    </div>

    <section id="content"></section>

    <div class="footer">
      EZ SPA COST V2.5 · Azie Balinese Spa · Simpanan data setempat pada peranti ini
    </div>
  </main>
</div>

<script>
const MONTHS = [
  'Januari','Februari','Mac','April','Mei','Jun',
  'Julai','Ogos','September','Oktober','November','Disember'
];

const MENUS = [
  ['Menu Utama','⌂','Dashboard dan pautan menu','#fff0f2','#fecdd5','#fb7185'],
  ['Maklumat Syarikat','▣','Profil & Tetapan Spa','#fff0f2','#fecdd5','#fb7185'],
  ['Dashboard Kos','⌁','KPI & Graf Kewangan','#e0f8eb','#a7f3d0','#10b981'],
  ['Rekod Belanjawan','▤','Jadual Perbelanjaan','#fff6d9','#fde68a','#f59e0b'],
  ['Lembaran Kos','▦','Pecahan Kos Bahan/Buruh','#f5e8fb','#e9d5ff','#a855f7'],
  ['Analisis Varians','⚖','Standard vs Sebenar','#e0f7f4','#99f6e4','#14b8a6'],
  ['Data Perkhidmatan','☷','Katalog Rawatan Spa','#e3f5ff','#bae6fd','#0ea5e9'],
  ['Pekerja & Terapis','♟','Senarai Staf & Kemahiran','#e9edff','#c7d2fe','#6366f1'],
  ['Cetak & Laporan','▣','Pencetak PDF Million Style','#fff0f2','#fecdd5','#f43f5e'],
  ['Ringkasan Kos','◔','Rumusan Keseluruhan Bulanan','#f1f9dc','#d9f99d','#65a30d']
];

const STORE = 'ezSpaCost_v25_data';

const defaultData = () => ({
  company: {
    name:'Azie Balinese Spa',
    address:'Kluang, Johor',
    phone:'',
    email:'',
    reg:'',
    manager:'',
    notes:''
  },
  services:[],
  staff:[],
  budgets:{},
  costs:{},
  variance:{}
});

let db = loadData();
let active = 0;

function loadData() {
  try {
    return Object.assign(defaultData(),JSON.parse(localStorage.getItem(STORE)||'{}'));
  } catch(e) {
    return defaultData();
  }
}

function save() {
  localStorage.setItem(STORE,JSON.stringify(db));
}

function period() {
  return document.getElementById('year').value + '-' +
    String(MONTHS.indexOf(document.getElementById('month').value)+1).padStart(2,'0');
}

function currentLabel() {
  return document.getElementById('month').value + ' ' +
    document.getElementById('year').value;
}

function money(n) {
  return (Number(n)||0).toLocaleString('ms-MY',{
    style:'currency',
    currency:'MYR',
    minimumFractionDigits:2
  });
}

function num(v) {
  return Number(v)||0;
}

function esc(s) {
  return String(s??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));
}

function init() {
  const m = document.getElementById('month');
  const y = document.getElementById('year');

  m.innerHTML = MONTHS.map(x=>`<option>${x}</option>`).join('');
  m.value = MONTHS[new Date().getMonth()];

  const yr = new Date().getFullYear();
  y.innerHTML = Array.from({length:9},(_,i)=>yr-4+i)
    .map(x=>`<option>${x}</option>`).join('');
  y.value = yr;

  m.onchange = render;
  y.onchange = render;

  document.getElementById('nav').innerHTML = MENUS.map((x,i)=>`
    <button id="nav${i}" onclick="go(${i})">
      <span class="ico" style="color:${x[5]}">${x[1]}</span>
      <span>${i+1}. ${x[0]}</span>
    </button>
  `).join('');

  render();
}

function go(i) {
  active = i;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function render() {
  document.querySelectorAll('.nav button').forEach((b,i)=>
    b.classList.toggle('active',i===active)
  );

  const c = document.getElementById('content');

  c.innerHTML =
    active===0 ? home() :
    active===1 ? companyPage() :
    active===2 ? dashboard() :
    active===3 ? budgetPage() :
    active===4 ? costPage() :
    active===5 ? variancePage() :
    active===6 ? servicesPage() :
    active===7 ? staffPage() :
    active===8 ? reportPage() :
    summaryPage();
}

function home() {
  return `
    <div class="hero">
      <div class="lotus">✿</div>
      <h2>Azie Balinese Spa</h2>
      <div class="tagline">Beauty • Relax • Rejuvenate</div>
      <h3>EZ SPA COST</h3>
      <p>Sistem Pengurusan &amp; Pengiraan Kos Perkhidmatan Spa Pintar</p>
    </div>

    <div class="cards">
      ${MENUS.slice(1).map((x,j)=>`
        <button class="card ${j===8?'wide':''}"
          style="--card-bg:${x[3]};--card-border:${x[4]};--accent:${x[5]}"
          onclick="go(${j+1})">
          <span class="icon">${x[1]}</span>
          <b>${j+2}. ${x[0]}</b>
          <small>${x[2]}</small>
        </button>
      `).join('')}
    </div>
  `;
}

function pageHead(title,sub,buttons='') {
  return `
    <div class="page-head">
      <div>
        <h2>${title}</h2>
        <div class="muted">${sub} · Tempoh: ${currentLabel()}</div>
      </div>
      <div class="actions no-print">${buttons}</div>
    </div>
  `;
}

function stat(label,value,desc='') {
  return `
    <div class="stat">
      <span>${label}</span>
      <strong>${value}</strong>
      <small class="muted">${desc}</small>
    </div>
  `;
}

function companyPage() {
  let c = db.company;

  return `
    <div class="page">
      ${pageHead('Maklumat Syarikat','Profil dan tetapan perniagaan')}

      <form onsubmit="saveCompany(event)">
        <div class="form-grid">
          ${field('Nama syarikat','name',c.name)}
          ${field('Alamat','address',c.address)}
          ${field('No. telefon','phone',c.phone,'tel')}
          ${field('E-mel','email',c.email,'email')}
          ${field('No. pendaftaran','reg',c.reg)}
          ${field('Pengurus','manager',c.manager)}
        </div>

        <div class="field">
          <label>Catatan</label>
          <textarea name="notes">${esc(c.notes)}</textarea>
        </div>

        <div class="actions">
          <button class="btn-green">Simpan Maklumat</button>
        </div>
      </form>

      <div class="notice">
        Maklumat ini digunakan pada paparan dan laporan.
        Lengkapkan butiran sebenar syarikat sebelum mencetak.
      </div>
    </div>
  `;
}

function field(label,name,value='',type='text',extra='') {
  return `
    <div class="field">
      <label>${label}</label>
      <input name="${name}" type="${type}" value="${esc(value)}" ${extra}>
    </div>
  `;
}

function saveCompany(e) {
  e.preventDefault();
  const f = new FormData(e.target);

  for (const k of ['name','address','phone','email','reg','manager','notes']) {
    db.company[k] = f.get(k)||'';
  }

  save();
  alert('Maklumat syarikat disimpan.');
  render();
}

function monthRecords(obj) {
  return obj[period()] || (obj[period()] = []);
}

function totals() {
  let budgets = db.budgets[period()] || [];
  let costs = db.costs[period()] || [];

  return {
    budget:budgets.reduce((s,r)=>s+num(r.amount),0),
    actual:costs.reduce((s,r)=>s+num(r.qty)*num(r.unit),0),
    items:costs.length,
    budgetCount:budgets.length
  };
}

function dashboard() {
  let t = totals();
  let diff = t.budget-t.actual;

  let months = MONTHS.map((m,i)=>{
    let p = document.getElementById('year').value+'-'+
      String(i+1).padStart(2,'0');

    return {
      m,
      v:(db.costs[p]||[]).reduce((s,r)=>s+num(r.qty)*num(r.unit),0)
    };
  });

  let max = Math.max(1,...months.map(x=>x.v));

  return `
    <div class="page">
      ${pageHead('Dashboard Kos','Petunjuk prestasi dan graf kos')}

      <div class="stats">
        ${stat('Jumlah Belanjawan',money(t.budget))}
        ${stat('Jumlah Kos Direkod',money(t.actual))}
        ${stat('Baki Belanjawan',money(diff),diff<0?'Kos melebihi belanjawan':'Belanjawan ditolak kos direkod')}
        ${stat('Rekod Kos',t.items+' item')}
      </div>

      <h3>Graf Kos Bulanan (${esc(document.getElementById('year').value)})</h3>

      <div class="chart-bars">
        ${months.map(x=>`
          <div class="bar-col">
            <em>${x.v?money(x.v):'—'}</em>
            <div class="bar" style="height:${Math.max(x.v?3:0,x.v/max*115)}px"></div>
            <small>${x.m.slice(0,3)}</small>
          </div>
        `).join('')}
      </div>

      <div class="actions">
        <button class="btn-outline" onclick="go(3)">＋ Rekod Belanjawan</button>
        <button class="btn-outline" onclick="go(4)">＋ Rekod Kos</button>
        <button class="btn-outline" onclick="go(5)">Analisis Varians</button>
      </div>

      <div class="notice ${diff<0?'warning':''}">
        ${diff<0
          ?'Perhatian: jumlah kos direkod melebihi jumlah belanjawan.'
          :'Petunjuk: masukkan rekod belanjawan dan kos untuk melihat analisis yang lebih lengkap.'}
      </div>
    </div>
  `;
}

function budgetPage() {
  let rows = db.budgets[period()]||[];
  let sum = rows.reduce((s,r)=>s+num(r.amount),0);

  return `
    <div class="page">
      ${pageHead('Rekod Belanjawan','Jadual perancangan perbelanjaan')}

      <div class="stats">
        ${stat('Jumlah Belanjawan',money(sum))}
        ${stat('Bilangan Rekod',rows.length+' rekod')}
        ${stat('Bulan',currentLabel())}
        ${stat('Status','Perancangan')}
      </div>

      <form onsubmit="addBudget(event)">
        <div class="form-grid">
          ${field('Tarikh','date',new Date().toISOString().slice(0,10),'date','required')}
          ${field('Kategori','category','','text','required')}
          ${field('Butiran perbelanjaan','detail','','text','required')}
          ${field('Amaun belanjawan (RM)','amount','','number','min="0" step="0.01" required')}
        </div>
        <div class="actions">
          <button class="btn-green">＋ Tambah Belanjawan</button>
        </div>
      </form>

      ${table(['Tarikh','Kategori','Butiran','Amaun (RM)','Tindakan'],
        rows.map((r,i)=>[
          esc(r.date),esc(r.category),esc(r.detail),money(r.amount),
          `<button class="mini" onclick="delRow('budgets',${i})">Padam</button>`
        ])
      )}
    </div>
  `;
}

function addBudget(e) {
  e.preventDefault();
  let f = new FormData(e.target);

  monthRecords(db.budgets).push({
    date:f.get('date'),
    category:f.get('category'),
    detail:f.get('detail'),
    amount:num(f.get('amount'))
  });

  save();
  render();
}

function costPage() {
  let rows = db.costs[period()]||[];
  let sum = rows.reduce((s,r)=>s+num(r.qty)*num(r.unit),0);

  return `
    <div class="page">
      ${pageHead('Lembaran Kos','Pengiraan kos bahan, buruh dan overhed')}

      <div class="stats">
        ${stat('Jumlah Kos',money(sum))}
        ${stat('Jumlah Item',rows.length+' item')}
        ${stat('Tempoh',currentLabel())}
        ${stat('Kaedah','Kuantiti × Kos seunit')}
      </div>

      <form onsubmit="addCost(event)">
        <div class="form-grid">
          ${field('Tarikh','date',new Date().toISOString().slice(0,10),'date','required')}
          ${field('Perkhidmatan / item','item','','text','required')}

          <div class="field">
            <label>Kategori kos</label>
            <select name="category">
              <option>Bahan</option>
              <option>Buruh</option>
              <option>Overhed</option>
              <option>Lain-lain</option>
            </select>
          </div>

          ${field('Kuantiti','qty','1','number','min="0" step="0.01" required')}
          ${field('Kos seunit (RM)','unit','','number','min="0" step="0.01" required')}
          ${field('Catatan','note')}
        </div>

        <div class="actions">
          <button class="btn-green">＋ Tambah Rekod Kos</button>
        </div>
      </form>

      ${table(['Tarikh','Item','Kategori','Kuantiti','Kos Seunit','Jumlah Kos','Catatan','Tindakan'],
        rows.map((r,i)=>[
          esc(r.date),esc(r.item),esc(r.category),num(r.qty),money(r.unit),
          money(num(r.qty)*num(r.unit)),esc(r.note),
          `<button class="mini" onclick="delRow('costs',${i})">Padam</button>`
        ])
      )}

      <div class="notice">
        Formula jumlah kos: kuantiti × kos seunit.
        Masukkan amaun berdasarkan rekod sebenar yang digunakan.
      </div>
    </div>
  `;
}

function addCost(e) {
  e.preventDefault();
  let f = new FormData(e.target);

  monthRecords(db.costs).push({
    date:f.get('date'),
    item:f.get('item'),
    category:f.get('category'),
    qty:num(f.get('qty')),
    unit:num(f.get('unit')),
    note:f.get('note')||''
  });

  save();
  render();
}

function variancePage() {
  let b = db.budgets[period()]||[];
  let c = db.costs[period()]||[];

  let planned = b.reduce((s,r)=>s+num(r.amount),0);
  let actual = c.reduce((s,r)=>s+num(r.qty)*num(r.unit),0);
  let v = planned-actual;

  return `
    <div class="page">
      ${pageHead('Analisis Varians','Perbandingan belanjawan (standard) dengan kos sebenar')}

      <div class="stats">
        ${stat('Kos Standard / Belanjawan',money(planned))}
        ${stat('Kos Sebenar Direkod',money(actual))}
        ${stat('Varians (Standard − Sebenar)',money(v))}
        ${stat('Status',v>0?'Memihak':v<0?'Tidak memihak':'Seimbang')}
      </div>

      <div class="notice ${v<0?'warning':''}">
        Formula varians = kos standard / belanjawan − kos sebenar.
        Varians positif bermaksud kos sebenar lebih rendah daripada belanjawan;
        varians negatif bermaksud kos sebenar melebihi belanjawan.
      </div>

      ${table(['Perkara','Amaun (RM)'],[
        ['Jumlah kos standard / belanjawan',money(planned)],
        ['Jumlah kos sebenar',money(actual)],
        ['Varians',money(v)],
        ['Status',v>0?'Memihak (penjimatan)':v<0?'Tidak memihak (lebihan kos)':'Seimbang']
      ])}

      <p class="muted">
        Nota: perbandingan di sini menggunakan jumlah belanjawan bulanan dan
        jumlah kos yang direkod. Untuk varians mengikut item/perkhidmatan,
        rekod standard dan sebenar perlu dipadankan secara khusus.
      </p>
    </div>
  `;
}

function servicesPage() {
  let rows = db.services;

  return `
    <div class="page">
      ${pageHead('Data Perkhidmatan','Katalog rawatan dan harga spa')}

      <form onsubmit="addService(event)">
        <div class="form-grid">
          ${field('Nama perkhidmatan','name','','text','required')}
          ${field('Tempoh (minit)','duration','','number','min="0" required')}
          ${field('Harga jualan (RM)','price','','number','min="0" step="0.01" required')}
          ${field('Kos standard (RM)','cost','','number','min="0" step="0.01" required')}
          ${field('Penerangan','description')}
        </div>

        <div class="actions">
          <button class="btn-green">＋ Tambah Perkhidmatan</button>
        </div>
      </form>

      ${table(['Perkhidmatan','Tempoh (minit)','Harga (RM)','Kos Standard (RM)','Untung Kasar Anggaran','Penerangan','Tindakan'],
        rows.map((r,i)=>[
          esc(r.name),r.duration,money(r.price),money(r.cost),
          money(num(r.price)-num(r.cost)),esc(r.description),
          `<button class="mini" onclick="delGlobal('services',${i})">Padam</button>`
        ])
      )}
    </div>
  `;
}

function addService(e) {
  e.preventDefault();
  let f = new FormData(e.target);

  db.services.push({
    name:f.get('name'),
    duration:num(f.get('duration')),
    price:num(f.get('price')),
    cost:num(f.get('cost')),
    description:f.get('description')||''
  });

  save();
  render();
}

function staffPage() {
  let rows = db.staff;

  return `
    <div class="page">
      ${pageHead('Pekerja & Terapis','Senarai staf, jawatan dan kadar upah')}

      <form onsubmit="addStaff(event)">
        <div class="form-grid">
          ${field('Nama pekerja','name','','text','required')}
          ${field('Jawatan / kemahiran','role','','text','required')}
          ${field('No. telefon','phone')}
          ${field('Kadar upah sejam (RM)','rate','','number','min="0" step="0.01" required')}
          ${field('Status','status','Aktif')}
        </div>

        <div class="actions">
          <button class="btn-green">＋ Tambah Pekerja</button>
        </div>
      </form>

      ${table(['Nama','Jawatan / Kemahiran','Telefon','Kadar Upah Sejam','Status','Tindakan'],
        rows.map((r,i)=>[
          esc(r.name),esc(r.role),esc(r.phone),money(r.rate),esc(r.status),
          `<button class="mini" onclick="delGlobal('staff',${i})">Padam</button>`
        ])
      )}
    </div>
  `;
}

function addStaff(e) {
  e.preventDefault();
  let f = new FormData(e.target);

  db.staff.push({
    name:f.get('name'),
    role:f.get('role'),
    phone:f.get('phone')||'',
    rate:num(f.get('rate')),
    status:f.get('status')||'Aktif'
  });

  save();
  render();
}

function summaryPage() {
  let t = totals();

  let rows = [
    ['Jumlah belanjawan',money(t.budget)],
    ['Jumlah kos sebenar direkod',money(t.actual)],
    ['Baki / (lebihan) belanjawan',money(t.budget-t.actual)],
    ['Bilangan rekod belanjawan',t.budgetCount],
    ['Bilangan item kos',t.items],
    ['Bilangan perkhidmatan',db.services.length],
    ['Bilangan pekerja / terapis',db.staff.length]
  ];

  return `
    <div class="page">
      ${pageHead('Ringkasan Kos','Rumusan keseluruhan bulanan')}

      <div class="stats">
        ${stat('Belanjawan',money(t.budget))}
        ${stat('Kos Sebenar',money(t.actual))}
        ${stat('Baki',money(t.budget-t.actual))}
        ${stat('Rekod',t.budgetCount+t.items+' jumlah')}
      </div>

      ${table(['Perkara','Nilai'],rows)}

      <div class="actions no-print">
        <button class="btn-green" onclick="exportExcel()">Eksport CSV untuk Excel</button>
        <button class="btn-pink" onclick="printReport()">Cetak / Simpan PDF</button>
      </div>
    </div>
  `;
}

function reportPage() {
  let t = totals();

  return `
    <div class="page">
      ${pageHead('Cetak & Laporan','Laporan ringkas gaya cetakan')}

      <div class="notice">
        Pilih <b>Cetak Laporan</b> di bahagian atas untuk membuka dialog cetak pelayar.
        Pilih “Save as PDF” jika mahu simpan sebagai PDF.
      </div>

      <div class="stats">
        ${stat('Syarikat',esc(db.company.name||'Belum diisi'))}
        ${stat('Tempoh',currentLabel())}
        ${stat('Belanjawan',money(t.budget))}
        ${stat('Kos Direkod',money(t.actual))}
      </div>

      <h3>Pratonton Laporan</h3>

      ${table(['Perkara','Nilai'],[
        ['Nama syarikat',esc(db.company.name)],
        ['Alamat',esc(db.company.address)],
        ['Tempoh laporan',currentLabel()],
        ['Jumlah belanjawan',money(t.budget)],
        ['Jumlah kos direkod',money(t.actual)],
        ['Varians (belanjawan − kos)',money(t.budget-t.actual)]
      ])}

      <div class="actions no-print">
        <button class="btn-pink" onclick="printReport()">▣ Cetak / Simpan PDF</button>
        <button class="btn-green" onclick="exportExcel()">Eksport data CSV</button>
      </div>
    </div>
  `;
}

function table(headers,rows) {
  if (!rows.length) {
    return `
      <div class="table-wrap">
        <table>
          <thead>
            <tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr>
          </thead>
          <tbody>
            <tr>
              <td class="empty" colspan="${headers.length}">
                Belum ada rekod untuk tempoh ini.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    `;
  }

  return `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr>
        </thead>
        <tbody>
          ${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function delRow(type,i) {
  if (confirm('Padam rekod ini?')) {
    db[type][period()].splice(i,1);
    save();
    render();
  }
}

function delGlobal(type,i) {
  if (confirm('Padam rekod ini?')) {
    db[type].splice(i,1);
    save();
    render();
  }
}

function addYear() {
  let y = Number(document.getElementById('year').value)+1;
  let s = document.getElementById('year');

  if (![...s.options].some(o=>Number(o.value)===y)) {
    let o = document.createElement('option');
    o.value = y;
    o.textContent = y;
    s.add(o);
  }

  s.value = y;
  render();
}

function resetMonth() {
  if (!confirm('Padam semua rekod belanjawan dan kos untuk '+currentLabel()+'? Maklumat syarikat, perkhidmatan dan pekerja tidak akan dipadam.')) return;

  delete db.budgets[period()];
  delete db.costs[period()];
  delete db.variance[period()];

  save();
  render();
}

function resetAll() {
  if (!confirm('AMARAN: Semua data sistem dalam pelayar ini akan dipadam. Teruskan?')) return;

  db = defaultData();
  save();
  render();
  go(0);
}

function csvCell(v) {
  let s = String(v??'');
  return '"'+s.replace(/"/g,'""')+'"';
}

function exportExcel() {
  let p = period();

  let rows = [
    ['EZ SPA COST V2.5 - AZIE BALINESE SPA'],
    ['Tempoh',currentLabel()],
    [],
    ['REKOD BELANJAWAN'],
    ['Tarikh','Kategori','Butiran','Amaun (RM)'],
    ...(db.budgets[p]||[]).map(r=>[r.date,r.category,r.detail,r.amount]),
    [],
    ['LEMBARAN KOS'],
    ['Tarikh','Item','Kategori','Kuantiti','Kos Seunit (RM)','Jumlah Kos (RM)','Catatan'],
    ...(db.costs[p]||[]).map(r=>[
      r.date,r.item,r.category,r.qty,r.unit,num(r.qty)*num(r.unit),r.note
    ]),
    [],
    ['RINGKASAN'],
    ['Jumlah Belanjawan',totals().budget],
    ['Jumlah Kos Sebenar',totals().actual],
    ['Varians',totals().budget-totals().actual],
    [],
    ['DATA PERKHIDMATAN'],
    ['Nama','Tempoh Minit','Harga RM','Kos Standard RM','Penerangan'],
    ...db.services.map(r=>[r.name,r.duration,r.price,r.cost,r.description]),
    [],
    ['PEKERJA & TERAPIS'],
    ['Nama','Jawatan','Telefon','Kadar Upah Sejam','Status'],
    ...db.staff.map(r=>[r.name,r.role,r.phone,r.rate,r.status])
  ];

  let csv = '\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
  let blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
  let a = document.createElement('a');

  a.href = URL.createObjectURL(blob);
  a.download = 'EZ_Spa_Cost_'+p+'.csv';
  a.click();

  URL.revokeObjectURL(a.href);
}

function printReport() {
  window.print();
}

init();
</script>
