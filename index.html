
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EZ SPA COST | Azie Balinese Spa</title>
<style>
:root{--pink:#e94f78;--dark:#962748;--green:#168567;--bg:#fff7fa;--card:#fff;--text:#303747;--line:#f1d7e0}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:bold}
button:hover{opacity:.88}
.primary{background:var(--pink);color:white}.green{background:var(--green);color:white}
.soft{background:#ffe5ed;color:var(--dark)}.danger{background:#ffe4e4;color:#a11}
input,select,textarea{padding:10px;border:1px solid var(--line);border-radius:8px;width:100%;background:white;color:#303747}
label{font-size:13px;font-weight:bold}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#fff0f5,#e4fff2)}
.authbox{background:white;width:min(430px,100%);padding:28px;border-radius:22px;box-shadow:0 10px 35px #0001}
.authbox h1{text-align:center;color:var(--dark)}.authbox form{display:grid;gap:12px}
.app{display:none;grid-template-columns:245px 1fr;min-height:100vh}
aside{background:white;border-right:1px solid var(--line);padding:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{text-align:center;padding:12px 0 20px}.logo{font-size:42px;color:var(--pink)}
.brand h2{color:var(--dark);font-family:Georgia,serif;margin:5px}
nav{display:grid;gap:5px}nav button{text-align:left;background:transparent;color:var(--text)}
nav button.active,nav button:hover{background:#ffe8ef;color:var(--dark)}
main{padding:22px;min-width:0}
.toolbar{background:white;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.toolbar select,.toolbar input{width:auto;max-width:160px}.grow{flex:1}
.hero{padding:35px 20px;border-radius:22px;text-align:center;background:linear-gradient(120deg,#ffe8f0,#f0fff7);margin-bottom:20px}
.hero h1{font:bold clamp(30px,4vw,48px) Georgia,serif;margin:10px}.hero h2{color:var(--green);letter-spacing:3px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card,.page,.stat{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:17px}
.card{text-align:center;cursor:pointer}.card .emoji{font-size:28px}.card h3{font-size:15px}
.page h2{margin-top:0}.muted{font-size:13px;color:#7b8493}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:15px 0}
.stat span{font-size:12px;color:#737d8c}.stat strong{display:block;font-size:22px;margin-top:8px;overflow-wrap:anywhere}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:15px 0}
.field{display:grid;gap:6px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:15px}
table{width:100%;border-collapse:collapse;min-width:650px}
th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line);font-size:13px}
th{background:#fff0f5;color:var(--dark)}tr:last-child td{border-bottom:0}
.notice{padding:12px;background:#e9fff4;border-radius:9px;margin:12px 0;font-size:13px}
.settings{background:#fff8fb;border:1px solid var(--line);border-radius:12px;padding:15px;margin-top:20px}
.yearchip{display:inline-flex;align-items:center;gap:6px;background:#ffe8ef;padding:6px 9px;border-radius:8px;margin:5px}
footer{text-align:center;color:#8b93a0;font-size:11px;margin:25px}
body.night{background:#191b29;color:#f5f5fb;--card:#272a3b;--line:#414258;--text:#f5f5fb}
body.night aside,body.night .toolbar,body.night .page,body.night .stat{background:#272a3b;color:#f5f5fb}
body.night input,body.night select,body.night textarea{background:#303348;color:white}

@media(max-width:900px){
 .app{grid-template-columns:1fr}
 aside{height:auto;position:relative}
 nav{grid-template-columns:repeat(2,minmax(0,1fr))}
 main{padding:12px}
 .stats{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:600px){
 .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
 .grid{grid-template-columns:1fr 1fr}
 .toolbar input,.toolbar select{max-width:100%}
}
@media(max-width:400px){
 .grid{grid-template-columns:1fr}
 .cards{grid-template-columns:1fr}
}

/* CETAK LAPORAN A4 - REKA BENTUK PREMIUM */
#printArea{display:none}

@media print{
 @page{size:A4 portrait;margin:13mm}

 html,body{
  margin:0!important;
  padding:0!important;
  width:100%!important;
  background:white!important;
  color:#303747!important;
  font-family:Arial,sans-serif!important;
  -webkit-print-color-adjust:exact!important;
  print-color-adjust:exact!important;
 }

 body>*:not(#printArea){
  display:none!important;
 }

 #printArea{
  display:block!important;
  width:100%!important;
  margin:0!important;
  padding:0!important;
  background:white!important;
  color:#303747!important;
  font-size:9pt!important;
 }

 #printArea *{box-sizing:border-box}

 #printArea .report-header{
  text-align:center;
  border-bottom:3px solid #168567;
  padding:8px 5px 15px;
  margin-bottom:20px;
 }

 #printArea .report-logo{
  font-size:30pt;
  color:#e94f78;
  line-height:1.2;
 }

 #printArea .report-header h1{
  font-family:Georgia,serif;
  font-size:23pt;
  color:#962748;
  margin:7px 0;
 }

 #printArea .report-header p{
  margin:4px 0;
  line-height:1.5;
 }

 #printArea .report-kicker{
  font-size:10pt;
  font-weight:bold;
  letter-spacing:2px;
  color:#168567;
  margin-top:14px!important;
 }

 #printArea .report-title{
  font-size:17pt;
  font-weight:bold;
  color:#962748;
  margin:7px 0!important;
 }

 #printArea .report-meta{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin:14px 0;
  padding:9px 11px;
  background:#fff4f7!important;
  border:1px solid #f1d7e0;
  border-radius:5px;
 }

 #printArea .report-section{
  margin-top:18px;
  break-inside:auto;
 }

 #printArea .report-section h2{
  font-size:12pt;
  color:#962748;
  padding:0 0 6px;
  margin:0 0 10px;
  border-bottom:1.5px solid #e8b9ca;
  break-after:avoid;
 }

 #printArea .report-summary{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
  margin:10px 0 16px;
 }

 #printArea .report-stat{
  border:1px solid #e8b9ca;
  border-left:4px solid #168567;
  padding:10px;
  border-radius:5px;
  break-inside:avoid;
 }

 #printArea .report-stat span{
  display:block;
  font-size:8pt;
  color:#6c7583;
 }

 #printArea .report-stat strong{
  display:block;
  font-size:13pt;
  color:#962748;
  margin-top:5px;
  overflow-wrap:anywhere;
 }

 #printArea table{
  width:100%!important;
  min-width:0!important;
  border-collapse:collapse!important;
  table-layout:auto;
  margin:8px 0 14px;
 }

 #printArea th{
  background:#fce7ef!important;
  color:#962748!important;
  font-weight:bold;
 }

 #printArea th,#printArea td{
  border:1px solid #e5d6dd!important;
  padding:6px 5px!important;
  text-align:left;
  font-size:8pt!important;
  line-height:1.35;
  overflow-wrap:anywhere;
 }

 #printArea tr{
  break-inside:avoid;
 }

 #printArea .report-note{
  background:#effaf5!important;
  border:1px solid #b9e2d1;
  padding:9px;
  border-radius:5px;
  margin:8px 0;
  line-height:1.5;
 }

 #printArea .report-footer{
  border-top:1px solid #e8b9ca;
  margin-top:28px;
  padding-top:10px;
  text-align:center;
  font-size:8pt;
  line-height:1.6;
 }

 #printArea .report-signatures{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:35px;
  margin-top:35px;
 }

 #printArea .signature{
  border-top:1px solid #777;
  padding-top:6px;
  text-align:center;
  font-size:8pt;
  margin-top:30px;
 }

 #printArea .no-record{
  font-style:italic;
  color:#777;
  padding:8px 0;
 }

 #printArea .report-page-break{
  break-before:page;
 }

 #printArea .report-section h2,
 #printArea .report-stat,
 #printArea .report-meta{
  break-inside:avoid;
 }
}
</style>
</head>
<body>

<section class="auth" id="auth">
 <div class="authbox">
  <div class="logo" style="text-align:center">✿</div>
  <h1>Azie Balinese Spa</h1>
  <p style="text-align:center">EZ SPA COST</p>
  <div class="actions">
   <button class="primary" onclick="showAuth('login')">Log Masuk</button>
   <button class="soft" onclick="showAuth('signup')">Daftar Akaun</button>
  </div>
  <form id="login" onsubmit="login(event)">
   <div class="field"><label>Username</label><input name="username" required></div>
   <div class="field"><label>Kata laluan</label><input name="password" type="password" required></div>
   <button class="green">Log Masuk</button>
   <button type="button" class="soft" onclick="showAuth('forgot')">Lupa Kata Laluan</button>
   <p id="loginMsg" class="muted"></p>
  </form>
  <form id="signup" hidden onsubmit="signup(event)">
   <div class="field"><label>Username</label><input name="username" required minlength="3"></div>
   <div class="field"><label>Kata laluan (minimum 6 aksara)</label><input name="password" type="password" required minlength="6"></div>
   <div class="field"><label>Sahkan kata laluan</label><input name="confirm" type="password" required minlength="6"></div>
   <button class="green">Daftar Akaun</button><p id="signupMsg" class="muted"></p>
  </form>
  <form id="forgot" hidden onsubmit="forgot(event)">
   <p class="muted">Masukkan username berdaftar untuk menetapkan kata laluan baharu.</p>
   <div class="field"><label>Username</label><input name="username" required></div>
   <div class="field"><label>Kata laluan baharu</label><input name="password" type="password" minlength="6" required></div>
   <button class="green">Tetapkan Semula</button>
   <button type="button" class="soft" onclick="showAuth('login')">Kembali</button><p id="forgotMsg" class="muted"></p>
  </form>
 </div>
</section>

<div class="app" id="app">
 <aside>
  <div class="brand"><div class="logo">✿</div><h2>Azie Balinese Spa</h2><b>EZ SPA COST</b><p class="muted">Sistem Pengurusan Kos</p></div>
  <nav id="nav"></nav>
  <hr style="border:0;border-top:1px solid var(--line);margin:18px 0">
  <p id="userLabel" class="muted"></p>
  <button class="soft" onclick="logout()">Log Keluar</button>
  <button class="danger" onclick="resetAll()">Padam Semua Data</button>
 </aside>
 <main>
  <div class="toolbar no-print">
   <b id="periodLabel">Tempoh:</b>
   <select id="month"></select>
   <select id="year"><option value="">Pilih tahun</option></select>
   <input id="newYear" type="number" min="1900" max="2200" placeholder="Masukkan tahun">
   <button class="green" onclick="addYear()">+ Tambah Tahun</button>
   <span class="grow"></span>
   <button class="green" onclick="exportCSV()">Export Excel</button>
   <button class="primary" onclick="printReport()">Cetak Laporan</button>
  </div>
  <section id="content"></section>
  <footer>EZ SPA COST · Azie Balinese Spa, Kluang</footer>
 </main>
</div>

<script>
const MONTHS=['Januari','Februari','Mac','April','Mei','Jun','Julai','Ogos','September','Oktober','November','Disember'];
const MENUS=[
 ['Menu Utama','🏠','Menu sistem'],['Maklumat Syarikat','🏢','Profil syarikat'],
 ['Dashboard Kos','📊','Ringkasan kewangan'],['Rekod Belanjawan','🧾','Perancangan perbelanjaan'],
 ['Lembaran Kos','🧮','Pengiraan kos sebenar'],['Analisis Varians','⚖️','Standard berbanding sebenar'],
 ['Data Perkhidmatan','💆','Senarai rawatan'],['Pekerja & Terapis','👥','Maklumat pekerja'],
 ['Cetak & Laporan','🖨️','Laporan bulanan'],['Ringkasan Kos','📑','Rumusan kos']
];
const STORE='ezSpaCostDataV3';
const defaults=()=>({company:{name:'Azie Balinese Spa',address:'Kluang, Johor',phone:'',email:'',reg:'',manager:'',notes:''},services:[],staff:[],budgets:{},costs:{}});
let db=loadDB(),active=0,currentUser=null;

function loadDB(){try{return Object.assign(defaults(),JSON.parse(localStorage.getItem(STORE)||'{}'))}catch(e){return defaults()}}
function save(){localStorage.setItem(STORE,JSON.stringify(db))}
function users(){try{return JSON.parse(localStorage.getItem('ezSpaUsersV3')||'{}')}catch(e){return {}}}
function saveUsers(u){localStorage.setItem('ezSpaUsersV3',JSON.stringify(u))}
function showAuth(which){['login','signup','forgot'].forEach(x=>document.getElementById(x).hidden=x!==which)}

function login(e){
 e.preventDefault();
 let f=new FormData(e.target),u=String(f.get('username')).trim(),p=String(f.get('password')),role='';
 if(u==='admin'&&p==='spa123@')role='admin';
 else if(users()[u]&&users()[u].password===p)role='user';
 if(!role){document.getElementById('loginMsg').textContent='Username atau kata laluan salah.';return}
 currentUser={username:u,role};
 document.getElementById('auth').style.display='none';
 document.getElementById('app').style.display='grid';
 document.getElementById('userLabel').textContent='Pengguna: '+u+' ('+role+')';
 render();
}
function signup(e){
 e.preventDefault();
 let f=new FormData(e.target),u=String(f.get('username')).trim(),p=String(f.get('password'));
 if(u.toLowerCase()==='admin'){document.getElementById('signupMsg').textContent='Username ini dikhaskan.';return}
 if(p!==f.get('confirm')){document.getElementById('signupMsg').textContent='Kata laluan tidak sepadan.';return}
 let all=users();
 if(all[u]){document.getElementById('signupMsg').textContent='Username telah digunakan.';return}
 all[u]={password:p};saveUsers(all);e.target.reset();showAuth('login');
 document.getElementById('loginMsg').textContent='Akaun berjaya dibuat. Sila log masuk.';
}
function forgot(e){
 e.preventDefault();
 let f=new FormData(e.target),u=String(f.get('username')).trim();
 if(u==='admin'){document.getElementById('forgotMsg').textContent='Kata laluan admin tidak boleh ditetapkan semula di sini.';return}
 let all=users();
 if(!all[u]){document.getElementById('forgotMsg').textContent='Username tidak ditemui.';return}
 all[u].password=f.get('password');saveUsers(all);
 document.getElementById('forgotMsg').textContent='Kata laluan dikemas kini. Sila log masuk.';
}
function logout(){currentUser=null;document.getElementById('app').style.display='none';document.getElementById('auth').style.display='grid';showAuth('login')}
function lang(){return localStorage.getItem('ezSpaLang')||'ms'}
function tr(ms,en){return lang()==='en'?en:ms}
function money(n){return (Number(n)||0).toLocaleString('ms-MY',{style:'currency',currency:'MYR'})}
function num(n){return Number(n)||0}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function period(){return (year.value||'belum')+'-'+String(MONTHS.indexOf(month.value)+1).padStart(2,'0')}
function records(obj){return obj[period()]||(obj[period()]=[])}
function total(){
 let b=db.budgets[period()]||[],c=db.costs[period()]||[];
 return {budget:b.reduce((s,x)=>s+num(x.amount),0),cost:c.reduce((s,x)=>s+num(x.qty)*num(x.unit),0),bc:b.length,cc:c.length};
}
function field(label,name,type='text',value='',required=true){
 return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''}></div>`;
}
function table(headers,rows){
 return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${headers.length}">Belum ada rekod.</td></tr>`}</tbody></table></div>`;
}
function stat(label,value){return `<div class="stat"><span>${label}</span><strong>${value}</strong></div>`}
function head(title,desc=''){return `<h2>${title}</h2><p class="muted">${desc} · ${esc(month.value)} ${year.value||tr('Tahun belum dipilih','Year not selected')}</p>`}

function init(){
 month.innerHTML=MONTHS.map(m=>`<option>${m}</option>`).join('');
 month.value=MONTHS[new Date().getMonth()];
 month.onchange=render;year.onchange=render;
 document.getElementById('nav').innerHTML=MENUS.map((m,i)=>`<button id="n${i}" onclick="go(${i})">${m[1]} ${i+1}. ${m[0]}</button>`).join('');
 const saved=JSON.parse(localStorage.getItem('ezSpaYears')||'[]');
 fillYears(saved);
 const theme=localStorage.getItem('ezSpaTheme')||'pink';setTheme(theme);
}
function go(i){active=i;render();window.scrollTo(0,0)}
function fillYears(list,selected=''){
 year.innerHTML='<option value="">Pilih tahun</option>'+list.sort((a,b)=>a-b).map(y=>`<option>${y}</option>`).join('');
 year.value=selected;
}
function addYear(){
 let y=Number(newYear.value);
 if(!newYear.value||!Number.isInteger(y)||y<1900||y>2200){alert('Masukkan tahun yang sah.');return}
 let list=JSON.parse(localStorage.getItem('ezSpaYears')||'[]');
 if(!list.includes(y))list.push(y);
 localStorage.setItem('ezSpaYears',JSON.stringify(list));
 fillYears(list,String(y));newYear.value='';render();
}
function deleteYear(y){
 if(!confirm('Padam tahun '+y+' dan semua rekod kos/belanjawan bagi tahun ini?'))return;
 let list=JSON.parse(localStorage.getItem('ezSpaYears')||'[]').filter(x=>x!==y);
 localStorage.setItem('ezSpaYears',JSON.stringify(list));
 ['budgets','costs'].forEach(k=>Object.keys(db[k]).forEach(p=>{if(p.startsWith(y+'-'))delete db[k][p]}));
 save();fillYears(list);render();
}
function setTheme(t){
 document.body.classList.toggle('night',t==='night');
 let palettes={pink:['#e94f78','#962748'],sage:['#168567','#075b47'],lavender:['#9570d9','#5c399b'],ocean:['#258ab8','#155578'],night:['#a78bfa','#ddd6fe']};
 let p=palettes[t]||palettes.pink;
 document.documentElement.style.setProperty('--pink',p[0]);
 document.documentElement.style.setProperty('--dark',p[1]);
 localStorage.setItem('ezSpaTheme',t);
}
function setLang(v){localStorage.setItem('ezSpaLang',v);render()}
function render(){
 document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('active',i===active));
 if(!year.value&&[2,3,4,5,8,9].includes(active)){
  content.innerHTML=`<div class="page">${head(tr('Pilih Tahun','Select Year'))}<p>${tr('Masukkan tahun di atas dan tekan Tambah Tahun untuk mula merekod.','Enter a year above and press Add Year to start recording.')}</p>${settingsBox()}</div>`;
  return;
 }
 content.innerHTML=[home,companyPage,dashboard,budgetPage,costPage,variancePage,servicesPage,staffPage,reportPage,summaryPage][active]();
}
function home(){
 return `<div class="hero"><div class="logo">✿</div><h1>Azie Balinese Spa</h1><p>Beauty • Relax • Rejuvenate</p><h2>EZ SPA COST</h2><p>Sistem Pengurusan dan Pengiraan Kos Perkhidmatan Spa</p></div><div class="cards">${MENUS.slice(1).map((m,j)=>`<div class="card" onclick="go(${j+1})"><div class="emoji">${m[1]}</div><h3>${j+2}. ${m[0]}</h3><p class="muted">${m[2]}</p></div>`).join('')}</div>`;
}
function companyPage(){
 let c=db.company;
 return `<div class="page">${head(tr('Maklumat Syarikat','Company Information'),'Profil dan tetapan perniagaan')}
 <form onsubmit="saveCompany(event)"><div class="grid">
 ${field(tr('Nama syarikat','Company name'),'name','text',c.name)}
 ${field(tr('Alamat','Address'),'address','text',c.address)}
 ${field(tr('No. telefon','Phone'),'phone','tel',c.phone,false)}
 ${field('Email','email','email',c.email,false)}
 ${field(tr('No. pendaftaran','Registration number'),'reg','text',c.reg,false)}
 ${field(tr('Pengurus','Manager'),'manager','text',c.manager,false)}
 </div><div class="field"><label>${tr('Catatan','Notes')}</label><textarea name="notes">${esc(c.notes)}</textarea></div><button class="green" style="margin-top:12px">${tr('Simpan Maklumat','Save Information')}</button></form>${settingsBox()}</div>`;
}
function settingsBox(){
 let years=JSON.parse(localStorage.getItem('ezSpaYears')||'[]');
 return `<div class="settings"><h3>${tr('Tetapan Sistem','System Settings')}</h3><div class="grid">
 <div class="field"><label>${tr('Tema','Theme')}</label><select id="themePick" onchange="setTheme(this.value)"><option value="pink">Pink Spa</option><option value="sage">Sage Green</option><option value="lavender">Lavender</option><option value="ocean">Ocean Blue</option><option value="night">Night Mode</option></select></div>
 <div class="field"><label>${tr('Bahasa','Language')}</label><select onchange="setLang(this.value)"><option value="ms" ${lang()==='ms'?'selected':''}>Bahasa Melayu</option><option value="en" ${lang()==='en'?'selected':''}>English</option></select></div></div>
 <h3>${tr('Pengurusan Tahun','Year Management')}</h3><div class="grid"><div class="field"><label>${tr('Tambah tahun','Add year')}</label><input id="yearSetting" type="number" min="1900" max="2200" placeholder="2026"></div></div>
 <div class="actions"><button type="button" class="green" onclick="addYearFromSettings()">${tr('Tambah Tahun','Add Year')}</button></div>
 ${years.map(y=>`<span class="yearchip">${y}<button class="danger" onclick="deleteYear(${y})">${tr('Padam','Delete')}</button></span>`).join('')}</div>`;
}
function addYearFromSettings(){newYear.value=yearSetting.value;addYear()}
function saveCompany(e){
 e.preventDefault();let f=new FormData(e.target);
 ['name','address','phone','email','reg','manager','notes'].forEach(k=>db.company[k]=f.get(k)||'');
 save();alert('Maklumat syarikat berjaya disimpan.');render();
}
function dashboard(){
 let t=total();
 let months=MONTHS.map((m,i)=>{
  let p=year.value+'-'+String(i+1).padStart(2,'0');
  return {m,v:(db.costs[p]||[]).reduce((s,r)=>s+num(r.qty)*num(r.unit),0)};
 });
 let max=Math.max(1,...months.map(x=>x.v));
 return `<div class="page">${head('Dashboard Kos','Ringkasan kewangan bulanan')}<div class="stats">${stat('Jumlah Belanjawan',money(t.budget))}${stat('Kos Sebenar',money(t.cost))}${stat('Baki Belanjawan',money(t.budget-t.cost))}${stat('Rekod Kos',t.cc)}</div><h3>Graf Kos Bulanan ${year.value}</h3><div style="display:flex;align-items:end;gap:8px;height:180px;border-bottom:1px solid var(--line);padding-top:15px">${months.map(x=>`<div style="flex:1;text-align:center;font-size:10px"><div style="height:${x.v/max*125}px;min-height:${x.v?3:0}px;background:var(--green);border-radius:5px 5px 0 0"></div>${x.m.slice(0,3)}</div>`).join('')}</div></div>`;
}
function budgetPage(){
 let rows=db.budgets[period()]||[],sum=rows.reduce((s,r)=>s+num(r.amount),0);
 return `<div class="page">${head('Rekod Belanjawan','Jadual perancangan perbelanjaan')}<div class="stats">${stat('Jumlah Belanjawan',money(sum))}${stat('Bilangan Rekod',rows.length)}</div><form onsubmit="addBudget(event)"><div class="grid">${field('Tarikh','date','date',new Date().toISOString().slice(0,10))}${field('Kategori','category')}${field('Butiran perbelanjaan','detail')}${field('Amaun belanjawan (RM)','amount','number','',true)}</div><button class="green">+ Tambah Belanjawan</button></form>${table(['Tarikh','Kategori','Butiran','Amaun (RM)','Tindakan'],rows.map((r,i)=>[esc(r.date),esc(r.category),esc(r.detail),money(r.amount),`<button class="danger" onclick="delRow('budgets',${i})">Padam</button>`]))}</div>`;
}
function addBudget(e){
 e.preventDefault();let f=new FormData(e.target);
 records(db.budgets).push({date:f.get('date'),category:f.get('category'),detail:f.get('detail'),amount:num(f.get('amount'))});
 save();render();
}
function costPage(){
 let rows=db.costs[period()]||[],sum=rows.reduce((s,r)=>s+num(r.qty)*num(r.unit),0);
 return `<div class="page">${head('Lembaran Kos','Pengiraan kos bahan, buruh dan overhed')}<div class="stats">${stat('Jumlah Kos',money(sum))}${stat('Bilangan Item',rows.length)}</div><form onsubmit="addCost(event)"><div class="grid">${field('Tarikh','date','date',new Date().toISOString().slice(0,10))}${field('Perkhidmatan / item','item')}<div class="field"><label>Kategori kos</label><select name="category"><option>Bahan</option><option>Buruh</option><option>Overhed</option><option>Lain-lain</option></select></div>${field('Kuantiti','qty','number','1')}${field('Kos seunit (RM)','unit','number')}${field('Catatan','note','text','',false)}</div><button class="green">+ Tambah Rekod Kos</button></form>${table(['Tarikh','Item','Kategori','Kuantiti','Kos Seunit','Jumlah Kos','Catatan','Tindakan'],rows.map((r,i)=>[esc(r.date),esc(r.item),esc(r.category),num(r.qty),money(r.unit),money(num(r.qty)*num(r.unit)),esc(r.note),`<button class="danger" onclick="delRow('costs',${i})">Padam</button>`]))}<div class="notice">Formula jumlah kos = kuantiti × kos seunit.</div></div>`;
}
function addCost(e){
 e.preventDefault();let f=new FormData(e.target);
 records(db.costs).push({date:f.get('date'),item:f.get('item'),category:f.get('category'),qty:num(f.get('qty')),unit:num(f.get('unit')),note:f.get('note')||''});
 save();render();
}
function variancePage(){
 let t=total(),v=t.budget-t.cost;
 return `<div class="page">${head('Analisis Varians','Perbandingan belanjawan dengan kos sebenar')}<div class="stats">${stat('Kos Standard / Belanjawan',money(t.budget))}${stat('Kos Sebenar',money(t.cost))}${stat('Varians',money(v))}${stat('Status',v>0?'Memihak':v<0?'Tidak memihak':'Seimbang')}</div><div class="notice">Formula varians = belanjawan − kos sebenar. Varians positif menunjukkan penjimatan; varians negatif menunjukkan kos melebihi belanjawan.</div>${table(['Perkara','Amaun (RM)'],[['Belanjawan',money(t.budget)],['Kos sebenar',money(t.cost)],['Varians',money(v)]])}</div>`;
}
function servicesPage(){
 let rows=db.services;
 return `<div class="page">${head('Data Perkhidmatan','Katalog rawatan dan harga spa')}<form onsubmit="addService(event)"><div class="grid">${field('Nama perkhidmatan','name')}${field('Tempoh (minit)','duration','number')}${field('Harga jualan (RM)','price','number')}${field('Kos standard (RM)','cost','number')}${field('Penerangan','description','text','',false)}</div><button class="green">+ Tambah Perkhidmatan</button></form>${table(['Perkhidmatan','Tempoh','Harga','Kos Standard','Untung Anggaran','Penerangan','Tindakan'],rows.map((r,i)=>[esc(r.name),r.duration,money(r.price),money(r.cost),money(num(r.price)-num(r.cost)),esc(r.description),`<button class="danger" onclick="delGlobal('services',${i})">Padam</button>`]))}</div>`;
}
function addService(e){
 e.preventDefault();let f=new FormData(e.target);
 db.services.push({name:f.get('name'),duration:num(f.get('duration')),price:num(f.get('price')),cost:num(f.get('cost')),description:f.get('description')||''});
 save();render();
}
function staffPage(){
 let rows=db.staff;
 return `<div class="page">${head('Pekerja & Terapis','Senarai staf dan kadar upah')}<form onsubmit="addStaff(event)"><div class="grid">${field('Nama pekerja','name')}${field('Jawatan / kemahiran','role')}${field('No. telefon','phone','tel','',false)}${field('Kadar upah sejam (RM)','rate','number')}${field('Status','status','text','Aktif')}</div><button class="green">+ Tambah Pekerja</button></form>${table(['Nama','Jawatan','Telefon','Kadar Upah','Status','Tindakan'],rows.map((r,i)=>[esc(r.name),esc(r.role),esc(r.phone),money(r.rate),esc(r.status),`<button class="danger" onclick="delGlobal('staff',${i})">Padam</button>`]))}</div>`;
}
function addStaff(e){
 e.preventDefault();let f=new FormData(e.target);
 db.staff.push({name:f.get('name'),role:f.get('role'),phone:f.get('phone')||'',rate:num(f.get('rate')),status:f.get('status')||'Aktif'});
 save();render();
}
function reportPage(){
 let t=total();
 return `<div class="page">${head('Cetak & Laporan','Pratonton laporan bulanan')}<div class="stats">${stat('Syarikat',esc(db.company.name))}${stat('Belanjawan',money(t.budget))}${stat('Kos Direkod',money(t.cost))}${stat('Varians',money(t.budget-t.cost))}</div>${table(['Perkara','Nilai'],[['Nama syarikat',esc(db.company.name)],['Alamat',esc(db.company.address)],['Tempoh',month.value+' '+year.value],['Jumlah belanjawan',money(t.budget)],['Jumlah kos sebenar',money(t.cost)],['Varians',money(t.budget-t.cost)]])}<div class="actions no-print"><button class="primary" onclick="printReport()">Cetak Laporan</button><button class="green" onclick="exportCSV()">Export Excel</button></div></div>`;
}
function summaryPage(){
 let t=total();
 return `<div class="page">${head('Ringkasan Kos','Rumusan keseluruhan bulanan')}<div class="stats">${stat('Belanjawan',money(t.budget))}${stat('Kos Sebenar',money(t.cost))}${stat('Baki',money(t.budget-t.cost))}${stat('Bilangan Rekod',t.bc+t.cc)}</div>${table(['Perkara','Nilai'],[['Jumlah belanjawan',money(t.budget)],['Jumlah kos sebenar',money(t.cost)],['Baki / (lebihan)',money(t.budget-t.cost)],['Bilangan rekod belanjawan',t.bc],['Bilangan item kos',t.cc],['Bilangan perkhidmatan',db.services.length],['Bilangan pekerja',db.staff.length]])}</div>`;
}
function delRow(type,i){
 if(confirm('Padam rekod ini?')){db[type][period()].splice(i,1);save();render()}
}
function delGlobal(type,i){
 if(confirm('Padam rekod ini?')){db[type].splice(i,1);save();render()}
}
function resetAll(){
 if(!currentUser||currentUser.role!=='admin'){alert('Fungsi ini hanya untuk Admin.');return}
 if(confirm('Padam semua data sistem?')){db=defaults();save();render();go(0)}
}
function exportCSV(){
 let t=total(),rows=[
 ['EZ SPA COST - AZIE BALINESE SPA'],['Tempoh',month.value+' '+year.value],[],
 ['REKOD BELANJAWAN'],['Tarikh','Kategori','Butiran','Amaun'],
 ...(db.budgets[period()]||[]).map(r=>[r.date,r.category,r.detail,r.amount]),[],
 ['LEMBARAN KOS'],['Tarikh','Item','Kategori','Kuantiti','Kos Seunit','Jumlah Kos','Catatan'],
 ...(db.costs[period()]||[]).map(r=>[r.date,r.item,r.category,r.qty,r.unit,num(r.qty)*num(r.unit),r.note]),[],
 ['Jumlah Belanjawan',t.budget],['Jumlah Kos Sebenar',t.cost],['Varians',t.budget-t.cost],[],
 ['PERKHIDMATAN'],['Nama','Tempoh','Harga','Kos Standard'],
 ...db.services.map(r=>[r.name,r.duration,r.price,r.cost]),[],
 ['PEKERJA'],['Nama','Jawatan','Telefon','Kadar Upah','Status'],
 ...db.staff.map(r=>[r.name,r.role,r.phone,r.rate,r.status])
 ];
 const cell=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 let csv='\ufeff'+rows.map(r=>r.map(cell).join(',')).join('\r\n');
 let a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
 a.download='EZ_Spa_Cost_'+period()+'.csv';a.click();URL.revokeObjectURL(a.href);
}

/* FUNGSI CETAK LAPORAN PREMIUM */
function printReport(){
 if(!year.value){
  alert('Sila pilih tahun sebelum mencetak laporan.');
  return;
 }

 const p=period();
 const budgets=db.budgets[p]||[];
 const costs=db.costs[p]||[];
 const t=total();
 const c=db.company;
 const reportDate=new Date().toLocaleDateString('ms-MY');
 const variance=t.budget-t.cost;

 const fmt=n=>money(n);
 const safe=s=>esc(s??'-');

 function makeTable(headers,rows){
  return `<table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${
   rows.length
   ?rows.map(row=>`<tr>${row.map(cell=>`<td>${cell}</td>`).join('')}</tr>`).join('')
   :`<tr><td colspan="${headers.length}">Tiada rekod untuk tempoh ini.</td></tr>`
  }</tbody></table>`;
 }

 const budgetRows=budgets.map((r,i)=>[
  i+1,safe(r.date),safe(r.category),safe(r.detail),fmt(r.amount)
 ]);

 const costRows=costs.map((r,i)=>[
  i+1,safe(r.date),safe(r.item),safe(r.category),
  num(r.qty),fmt(r.unit),fmt(num(r.qty)*num(r.unit))
 ]);

 const serviceRows=db.services.map((r,i)=>[
  i+1,safe(r.name),safe(r.duration),fmt(r.price),
  fmt(r.cost),fmt(num(r.price)-num(r.cost))
 ]);

 const staffRows=db.staff.map((r,i)=>[
  i+1,safe(r.name),safe(r.role),safe(r.phone),
  fmt(r.rate),safe(r.status)
 ]);

 const area=document.createElement('div');
 area.id='printArea';

 area.innerHTML=`
  <div class="report-header">
   <div class="report-logo">✿</div>
   <h1>${safe(c.name)}</h1>
   <p>${safe(c.address)}</p>
   <p>${c.phone?'Telefon: '+safe(c.phone):''}${c.email?' | Email: '+safe(c.email):''}</p>
   <p class="report-kicker">SISTEM PENGURUSAN KOS</p>
   <div class="report-title">LAPORAN KOS PERKHIDMATAN SPA</div>
   <p><strong>EZ SPA COST</strong></p>
  </div>

  <div class="report-meta">
   <div><strong>Tempoh:</strong> ${safe(month.value)} ${safe(year.value)}</div>
   <div><strong>Tarikh cetakan:</strong> ${reportDate}</div>
  </div>

  <div class="report-section">
   <h2>1. Ringkasan Kos</h2>
   <div class="report-summary">
    <div class="report-stat"><span>Jumlah Belanjawan</span><strong>${fmt(t.budget)}</strong></div>
    <div class="report-stat"><span>Jumlah Kos Sebenar</span><strong>${fmt(t.cost)}</strong></div>
    <div class="report-stat"><span>Varians Belanjawan</span><strong>${fmt(variance)}</strong></div>
    <div class="report-stat"><span>Baki Belanjawan</span><strong>${fmt(variance)}</strong></div>
   </div>
  </div>

  <div class="report-section">
   <h2>2. Rekod Belanjawan</h2>
   ${makeTable(['Bil.','Tarikh','Kategori','Butiran Perbelanjaan','Amaun (RM)'],budgetRows)}
   <p><strong>Jumlah Belanjawan: ${fmt(t.budget)}</strong></p>
  </div>

  <div class="report-section">
   <h2>3. Lembaran Kos</h2>
   ${makeTable(['Bil.','Tarikh','Item','Kategori','Kuantiti','Kos Seunit (RM)','Jumlah Kos (RM)'],costRows)}
   <p><strong>Jumlah Kos Sebenar: ${fmt(t.cost)}</strong></p>
  </div>

  <div class="report-section">
   <h2>4. Analisis Varians</h2>
   ${makeTable(['Perkara','Amaun (RM)'],[
    ['Kos Standard / Belanjawan',fmt(t.budget)],
    ['Kos Sebenar',fmt(t.cost)],
    ['Varians (Belanjawan − Kos Sebenar)',fmt(variance)],
    ['Status',variance>0?'Penjimatan / Memihak':variance<0?'Kos Melebihi Belanjawan / Tidak Memihak':'Seimbang']
   ])}
   <div class="report-note">
    <strong>Formula:</strong> Varians = Belanjawan − Kos Sebenar.<br>
    Varians positif menunjukkan belanjawan melebihi kos sebenar.
    Varians negatif menunjukkan kos sebenar melebihi belanjawan.
   </div>
  </div>

  <div class="report-section">
   <h2>5. Data Perkhidmatan</h2>
   ${makeTable(['Bil.','Perkhidmatan','Tempoh (minit)','Harga (RM)','Kos Standard (RM)','Untung Anggaran (RM)'],serviceRows)}
  </div>

  <div class="report-section">
   <h2>6. Pekerja dan Terapis</h2>
   ${makeTable(['Bil.','Nama','Jawatan','Telefon','Kadar Upah (RM)','Status'],staffRows)}
  </div>

  <div class="report-section">
   <h2>7. Maklumat Syarikat</h2>
   ${makeTable(['Perkara','Maklumat'],[
    ['Nama Syarikat',safe(c.name)],
    ['Alamat',safe(c.address)],
    ['No. Telefon',safe(c.phone)],
    ['Email',safe(c.email)],
    ['No. Pendaftaran',safe(c.reg)],
    ['Pengurus',safe(c.manager)],
    ['Catatan',safe(c.notes)]
   ])}
  </div>

  <div class="report-signatures">
   <div class="signature">Disediakan oleh</div>
   <div class="signature">Disemak dan diluluskan oleh</div>
  </div>

  <div class="report-footer">
   <strong>${safe(c.name)}</strong><br>
   Laporan ini dijana menggunakan EZ SPA COST.<br>
   Dicetak pada ${reportDate}.
  </div>
 `;

 const old=document.getElementById('printArea');
 if(old)old.remove();

 document.body.appendChild(area);

 const cleanup=()=>{
  if(area.isConnected)area.remove();
  window.removeEventListener('afterprint',cleanup);
 };

 window.addEventListener('afterprint',cleanup);
 window.print();
}

init();
</script>
</body>
</html>
